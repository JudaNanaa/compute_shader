[package]
name = "black_and_white_png"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bytemuck = { version = "1.25.0", features = ["derive"] }
console_error_panic_hook = "0.1.7"
log = "0.4.29"
pollster = "0.4.0"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.3"
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"
web-sys = { version = "0.3.91", features = ["Document", "Element", "Window"] }
wgpu = "28.0.0"
winit = "0.30.12"

[dependencies.image]
version = "0.25.9"
default-features = false
features = ["png", "jpeg"]
